name: Prüfen

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung, Tests, Build, Store-Regeln
        run: npm run verify
      - name: Ablauftest im Browser
        run: npm run e2e
        env:
          CHROME_PFAD: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bildschirmfotos
          path: e2e-bilder/
