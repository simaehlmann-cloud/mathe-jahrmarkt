name: Android Release (Play Store)

# Baut das signierte App-Bundle (.aab) für Google Play. Start von Hand:
# GitHub → Actions → „Android Release (Play Store)“ → „Run workflow“.
# Version und versionCode kommen aus android/app/build.gradle (0.13.2 → 1302).
# Jeder Upload in die Play Console braucht einen höheren versionCode als der letzte.
#
# Einmalig nötig (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    Upload-Schlüssel (.jks oder .keystore) als Base64
#   ANDROID_KEYSTORE_PASSWORD  Kennwort des Schlüsselspeichers
#   ANDROID_KEY_ALIAS          Alias des Schlüssels
#   ANDROID_KEY_PASSWORD       Kennwort des Schlüssels (oft gleich dem Speicher-Kennwort)

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Secrets vorhanden?
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fehlt=""
          [ -n "$KS" ] || fehlt="$fehlt ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || fehlt="$fehlt ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || fehlt="$fehlt ANDROID_KEY_ALIAS"
          [ -n "$KP" ] || fehlt="$fehlt ANDROID_KEY_PASSWORD"
          if [ -n "$fehlt" ]; then echo "::error::Es fehlen Secrets:$fehlt"; exit 1; fi

      - run: npm ci
      - name: Store-Version bauen und prüfen (ohne Testkauf)
        run: npm run verify
        env:
          VITE_PLATTFORM: android
      - name: In das Android-Projekt kopieren
        run: npx cap sync android

      - name: Upload-Schlüssel bereitstellen
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          GROESSE=$(stat -c%s "$RUNNER_TEMP/upload.jks")
          [ "$GROESSE" -gt 500 ] || { echo "::error::Schlüssel sieht unvollständig aus ($GROESSE Bytes). Base64 ganz kopiert?"; exit 1; }

      - name: Signiertes App-Bundle bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Signatur prüfen
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/sig.txt"
          grep -q "jar verified" "$RUNNER_TEMP/sig.txt" || { echo "::error::Das Bundle ist nicht signiert"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          cp "$AAB" "mathe-jahrmarkt-$VERSION.aab"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Schlüssel löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: mathe-jahrmarkt-${{ env.VERSION }}-aab
          path: mathe-jahrmarkt-*.aab
          retention-days: 30
